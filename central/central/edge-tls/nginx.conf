# Puerta mTLS de los nodos hacia la API sync. El nodo se identifica por el CN de su certificado de cliente:
# el encabezado X-Node-Id que envie el nodo se reemplaza siempre por ese CN.
map $ssl_client_s_dn $node_cn {
    ~CN=(?<cn>[^,/]+) $cn;
    default "";
}

server {
    listen 8443 ssl;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_client_certificate /tls/ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.3;
    client_max_body_size 600k;

    location /edge/ {
        if ($node_cn = "") { return 403; }
        # Se resuelve en cada solicitud: la API sync puede reiniciarse con otra IP.
        resolver 127.0.0.11 valid=5s;
        set $sync_api http://sync:8000;
        proxy_set_header X-Node-Id $node_cn;
        proxy_pass $sync_api;
    }
    location / { return 404; }
}
